  services:
  - type: web
    name: autoai-backend
    runtime: python
    plan: free
    rootDir: AutoAI/backend
    buildCommand: pip install --upgrade pip && pip install -r requirements-prod.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: GEMINI_TIMEOUT
        value: "10"
      - key: CORS_ORIGINS
        sync: false
      - key: ENVIRONMENT
        value: production
